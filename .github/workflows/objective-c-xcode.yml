name: SwiftPM - Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and test using Swift Package Manager
    runs-on: macos-latest
    env:
      SWIFTPM_DISABLE_SANDBOX: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: swift build -c debug
      - name: Test
        run: swift test -c debug
